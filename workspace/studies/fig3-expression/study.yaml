  the chromosome fast while the two replisomes cover it more slowly, and collisions are dominated by RNA
  polymerase displacing SMC then SSB — the qualitative pattern of Karr 2012 Fig 3E. Coordinate-resolved
  but reduced (binned, approximate gene positions).'
