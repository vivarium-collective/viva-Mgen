schema_version: 4
name: fig3-expression
title: Fig 3 — Chromosome DNA-protein interactions (viva-Mgen)
created: '2026-09-12'
status: complete
phase: Evaluate
question: 'Does the reduced viva-Mgen expression module (stochastic transcription +

  translation + RNA/protein decay on a representative gene panel) reproduce the

  qualitative single-cell gene-expression dynamics of Fig 3 / 2G-2H — bursty,

  low-copy mRNA alongside protein that accumulates to much higher, more stable

  copy numbers (the mRNA↔protein decoupling)?

  '
hypothesis: 'With Poisson synthesis and Poisson decay running through shared stores, mRNA

  should stay low and bursty (order 0-2 copies per gene, set by short half-lives

  and low synthesis rates), while protein — synthesized proportionally to mRNA

  and decaying far more slowly — should accumulate to copy numbers orders of

  magnitude above mRNA, reproducing the Fig 2H decoupling qualitatively.

  '
objective: 'Run the fig3_expression composite (transcription + translation + rna_decay +

  protein_decay) for one hour at the default 1 s interval, gather per-gene mRNA

  and protein counts, and read out mean mRNA per gene, final total protein, the

  protein-to-mRNA ratio, and the fraction of panel genes expressed.

  '
description: 'Now GENUINELY MODELED (not a reduced analog): a coordinate-resolved ChromosomeDynamicsReproductionProcess
  bins the 580,070 bp chromosome, initiates RNA polymerases at gene sites (locus-tag-ordered positions)
  and elongates them, advances two replisomes bidirectionally from oriC, places structural proteins (SMC/SSB/gyrase/topo/DnaA/TFs),
  and detects+resolves polymerase-protein collisions. Reproduces Fig 3A (occupancy density), 3B (chromosome
  exploration kinetics), 3C (% RNA expressed / t50), 3D (polymerase position kymograph), 3E (collision-frequency
  matrix), 3F (collisions vs binding density). REDUCED fidelity: binned genome + approximate (locus-ordered)
  gene coordinates + representative protein counts.'
baseline:
- name: baseline
  composite: viva_mgen.composites.mgen.mycoplasma_genitalium
  params:
    seed: 0
variants: []
simulation_set:
- name: baseline
  status: ran
  base_model: viva_mgen.composites.mgen.mycoplasma_genitalium
  duration_min: 60
  seeds:
  - 0
  condition: Canonical viva-Mgen fig3-expression run via sims/run.py (recorded in .pbg/runs.jsonl).
  params:
    seed: 0
  readouts:
  - mean_mrna_per_gene
  - protein_to_mrna_ratio
  - fraction_genes_expressed
  applies_tests:
  - mrna-is-bursty-low-copy
  - protein-exceeds-mrna
  - genes-become-expressed
expected_behavior:
- name: chromosome-50pct-bound-by-6min
  en: '% of the chromosome protein-bound at 6 min ≈ 50% (Fig 3B).'
  observable: pct_explored_at_6min
  condition: 40 <= pct_explored_at_6min <= 65
  rationale: 'Karr 2012 Fig 3B: 50% of the chromosome is bound by ≥1 protein within the first 6 min.'
  measure:
    kind: derived_scalar
    field: pct_explored_at_6min
  expect:
    op: range
    low: 40
    high: 65
- name: chromosome-90pct-bound-by-20min
  en: '% of the chromosome protein-bound at 20 min ≈ 90% (Fig 3B).'
  observable: pct_explored_at_20min
  condition: 80 <= pct_explored_at_20min <= 100
  rationale: 'Karr 2012 Fig 3B: 90% of the chromosome bound within 20 min.'
  measure:
    kind: derived_scalar
    field: pct_explored_at_20min
  expect:
    op: range
    low: 80
    high: 100
- name: rnap-binds-90pct-within-49min
  en: RNA polymerase binds 90% of the chromosome within 49 min (Fig 3B).
  observable: rnap_90pct_time_min
  condition: 0 <= rnap_90pct_time_min <= 49
  rationale: 'Karr 2012 Fig 3B: RNA polymerase binds 90% of the chromosome within the first 49 min.'
  measure:
    kind: derived_scalar
    field: rnap_90pct_time_min
  expect:
    op: range
    low: 0
    high: 49
- name: rna-expression-t50-18min
  en: Time for 50% of genes to be expressed ≈ 18 min (Fig 3C).
  observable: rna_t50_min
  condition: 10 <= rna_t50_min <= 30
  rationale: 'Karr 2012 Fig 3C: RNA-expression t50 = 18 min.'
  measure:
    kind: derived_scalar
    field: rna_t50_min
  expect:
    op: range
    low: 10
    high: 30
- name: rna-expression-90pct-by-143min
  en: 90% of genes expressed within ~143 min (Fig 3C).
  observable: rna_t90_min
  condition: 60 <= rna_t90_min <= 200
  rationale: 'Karr 2012 Fig 3C: 90% of genes expressed within the first 143 min.'
  measure:
    kind: derived_scalar
    field: rna_t90_min
  expect:
    op: range
    low: 60
    high: 200
- name: collisions-per-cycle-gt-30000
  en: More than 30,000 protein–DNA collisions per cell cycle (Fig 3F).
  observable: n_collisions_per_cycle
  condition: 30000 <= n_collisions_per_cycle <= 1000000000.0
  rationale: 'Karr 2012 Fig 3F: >30,000 collisions per cell (~0.93 displacements/s).'
  measure:
    kind: derived_scalar
    field: n_collisions_per_cycle
  expect:
    op: range
    low: 30000
    high: 1000000000.0
- name: collisions-mostly-by-rnap
  en: Most collisions are caused by RNA polymerase (~84%; Fig 3F).
  observable: frac_collisions_by_rnap
  condition: 0.7 <= frac_collisions_by_rnap <= 1.0
  rationale: 'Karr 2012 Fig 3F: collisions caused mostly by RNA polymerase (84%) and DNA pol (8%).'
  measure:
    kind: derived_scalar
    field: frac_collisions_by_rnap
  expect:
    op: range
    low: 0.7
    high: 1.0
- name: collisions-displace-smc
  en: Collisions displace mostly SMC (~70%; Fig 3F).
  observable: frac_collisions_displacing_smc
  condition: 0.5 <= frac_collisions_displacing_smc <= 0.85
  rationale: 'Karr 2012 Fig 3F: displaced proteins are mostly SMC (70%) and SSB (6%).'
  measure:
    kind: derived_scalar
    field: frac_collisions_displacing_smc
  expect:
    op: range
    low: 0.5
    high: 0.85
- name: collisions-density-positive
  en: Collisions rise with DNA-bound-protein density — positive correlation (Fig 3F).
  observable: collisions_density_pearson_r
  condition: 0.2 <= collisions_density_pearson_r <= 1.0
  rationale: 'Karr 2012 Fig 3F: collisions vs DNA-bound protein density are positively correlated.'
  measure:
    kind: derived_scalar
    field: collisions_density_pearson_r
  expect:
    op: range
    low: 0.2
    high: 1.0
behavior_tests:
- name: chromosome-50pct-bound-by-6min
  classification: primary
  description: '% of the chromosome protein-bound at 6 min ≈ 50% (Fig 3B).'
  measure:
