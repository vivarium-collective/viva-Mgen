schema_version: 4
name: fig3-expression
title: Fig 3 — Chromosome DNA-protein interactions (viva-Mgen)
created: '2026-09-12'
status: complete
phase: Evaluate
question: 'Does the reduced viva-Mgen expression module (stochastic transcription +

  translation + RNA/protein decay on a representative gene panel) reproduce the

  qualitative single-cell gene-expression dynamics of Fig 3 / 2G-2H — bursty,

  low-copy mRNA alongside protein that accumulates to much higher, more stable

  copy numbers (the mRNA↔protein decoupling)?

  '
hypothesis: 'With Poisson synthesis and Poisson decay running through shared stores, mRNA

  should stay low and bursty (order 0-2 copies per gene, set by short half-lives

  and low synthesis rates), while protein — synthesized proportionally to mRNA

  and decaying far more slowly — should accumulate to copy numbers orders of

  magnitude above mRNA, reproducing the Fig 2H decoupling qualitatively.

  '
objective: 'Run the fig3_expression composite (transcription + translation + rna_decay +

  protein_decay) for one hour at the default 1 s interval, gather per-gene mRNA

  and protein counts, and read out mean mRNA per gene, final total protein, the

  protein-to-mRNA ratio, and the fraction of panel genes expressed.

  '
description: 'Now GENUINELY MODELED (not a reduced analog): a coordinate-resolved ChromosomeDynamicsReproductionProcess
  bins the 580,070 bp chromosome, initiates RNA polymerases at gene sites (locus-tag-ordered positions)
  and elongates them, advances two replisomes bidirectionally from oriC, places structural proteins (SMC/SSB/gyrase/topo/DnaA/TFs),
  and detects+resolves polymerase-protein collisions. Reproduces Fig 3A (occupancy density), 3B (chromosome
  exploration kinetics), 3C (% RNA expressed / t50), 3D (polymerase position kymograph), 3E (collision-frequency
  matrix), 3F (collisions vs binding density). REDUCED fidelity: binned genome + approximate (locus-ordered)
  gene coordinates + representative protein counts.'
baseline:
- name: baseline
  composite: viva_mgen.composites.mgen.mycoplasma_genitalium
  params:
    seed: 0
variants: []
simulation_set:
- name: baseline
  status: ran
  base_model: viva_mgen.composites.mgen.mycoplasma_genitalium
  duration_min: 60
  seeds:
  - 0
  condition: Canonical viva-Mgen fig3-expression run via sims/run.py (recorded in .pbg/runs.jsonl).
  params:
    seed: 0
  readouts:
  - mean_mrna_per_gene
  - protein_to_mrna_ratio
  - fraction_genes_expressed
  applies_tests:
  - mrna-is-bursty-low-copy
  - protein-exceeds-mrna
  - genes-become-expressed
expected_behavior:
- name: mrna-is-bursty-low-copy
  en: mRNA stays low-copy and bursty — time-averaged mRNA per gene is order 0-2 copies (Fig 2G).
  observable: mean_mrna_per_gene
  condition: 0.0 <= mean_mrna_per_gene <= 5.0
  rationale: Short mRNA half-lives (~150-180 s) and low synthesis rates keep steady-state mRNA at a fraction
    of one to a few copies per gene. Achieved ~1.6.
  measure:
    kind: derived_scalar
    field: mean_mrna_per_gene
  expect:
    op: range
    low: 0.0
    high: 5.0
- name: protein-exceeds-mrna
  en: Protein accumulates far above mRNA — the mRNA↔protein decoupling of Fig 2H (ratio >> 1).
  observable: protein_to_mrna_ratio
  condition: protein_to_mrna_ratio >= 5.0
  rationale: Protein is synthesized proportionally to mRNA but decays ~150× more slowly (half-life 25000
    s vs ~170 s), so it accumulates to orders of magnitude more copies than the transient mRNA pool. Achieved
    ~200.
  measure:
    kind: derived_scalar
    field: protein_to_mrna_ratio
  expect:
    op: range
    low: 5.0
    high: 1.0e9
- name: genes-become-expressed
  en: Every panel gene has produced protein by the end of one hour (fraction ≈ 1.0).
  observable: fraction_genes_expressed
  condition: fraction_genes_expressed >= 0.9
  rationale: Over an hour each gene fires enough transcription/translation events that all 6 accumulate
    protein. Achieved 1.000.
  measure:
    kind: derived_scalar
    field: fraction_genes_expressed
  expect:
    op: range
    low: 0.9
    high: 1.0
behavior_tests:
- name: mrna-is-bursty-low-copy
  classification: primary
  description: Time-averaged mRNA per gene within [0, 5] copies (low, bursty).
  measure:
    kind: derived_scalar
    field: mean_mrna_per_gene
  pass_if:
    op: range
    low: 0.0
    high: 5.0
    provenance:
      kind: experiment
      note: Single-cell mRNA is low-copy and bursty (Karr 2012 Fig 2G); reduced panel achieved mean_mrna_per_gene
        ~1.6. Representative rates, not KB-fitted.
  requires_simulation: baseline
- name: protein-exceeds-mrna
  classification: primary
  description: Final protein-to-mRNA ratio within [5, 1e9] — protein >> mRNA (decoupling).
  measure:
    kind: derived_scalar
    field: protein_to_mrna_ratio
  pass_if:
    op: range
    low: 5.0
    high: 1.0e9
    provenance:
      kind: experiment
      note: mRNA and protein copy-number distributions are decoupled, protein far higher (Karr 2012 Fig
        2H); achieved ratio ~200 (varies run to run).
  requires_simulation: baseline
- name: genes-become-expressed
  classification: primary
  description: Fraction of panel genes with protein by 1 h within [0.9, 1.0].
  measure:
    kind: derived_scalar
    field: fraction_genes_expressed
  pass_if:
    op: range
    low: 0.9
    high: 1.0
    provenance:
      kind: model
      note: Over 1 h all representative genes express; achieved 1.000.
  requires_simulation: baseline
readouts:
- name: ntp
