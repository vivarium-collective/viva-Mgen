schema_version: 4
name: fig1-architecture
title: 'Fig 1 — Whole-cell integration: six submodels wired through shared cell variables'
created: '2026-09-12'
status: complete
phase: Evaluate
question: 'Does viva-Mgen actually reproduce Fig 1''s central architectural claim — that

  the whole-cell model is a set of independent submodels *integrated* through a

  shared set of cell variables — as a real, runnable composite rather than a

  drawing? Do all six submodels compose, share stores, and run as one integrated

  cell?

  '
hypothesis: 'Building the fig1_architecture composite should wire exactly six submodels

  (metabolism, mass, transcription, translation, rna_decay, protein_decay) to a

  common set of bigraph stores such that several cell variables are touched by

  more than one submodel (the coupling that makes it "integrated"), and running

  the composite for 20 min should keep the cell viable (growth_fraction ≈ 1) and

  growing (mass increasing) — reproducing the integrated-architecture picture of

  Fig 1A/1B.

  '
objective: 'Build the integrated composite, derive the process↔cell-variable wiring matrix

  directly from the composite document (a genuine Fig 1B-style diagram), count

  the submodels and the shared/coupled stores, and run the integrated cell to

  confirm it composes and stays viable.

  '
description: 'Representative / architecture-demonstration fidelity. This study demonstrates

  the ARCHITECTURE — that the reduced-but-genuine submodels compose into one

  integrated cell that runs — not a quantitative fit of any single phenotype

  (those live in fig2-growth, fig3-expression, fig5-energy). Metabolism and mass

  run on a coarse 60 s timestep to keep FBA cost reasonable; the stochastic

  expression processes run at 1 s. The wiring matrix is read straight from the

  composite doc, so the diagram is the model, not an illustration of it.

  Achieved (committed run, 1200 s): 6 processes, 3 cell variables coupled across

  ≥2 submodels (growth_fraction, rna_counts, protein_counts), growth_fraction

  1.000 at the end, mass grew 3.93 → 4.03 fg. Stochastic expression is low over

  20 min, so distinct mRNA/protein species produced were 0 — expected and not a

  fidelity claim of this study.

  '
baseline:
- name: baseline
  composite: viva_mgen.composites.mgen.mycoplasma_genitalium
  params: {}
variants: []
simulation_set:
- name: baseline
  status: ran
  base_model: viva_mgen.composites.mgen.mycoplasma_genitalium
  duration_min: 20
  seeds:
  - 0
  condition: Canonical viva-Mgen fig1-architecture run via sims/run.py (recorded in .pbg/runs.jsonl).
  readouts:
  - n_processes
  - n_stores_coupled
  - growth_fraction_final
  applies_tests:
  - architecture-integrates-six-submodels
  - submodels-are-coupled
  - cell-is-viable
expected_behavior:
- name: architecture-integrates-six-submodels
  en: The integrated cell is composed of exactly six submodels (Fig 1A).
  observable: n_processes
  condition: n_processes == 6
  rationale: fig1_architecture wires metabolism, mass, transcription, translation, rna_decay and protein_decay
    — the six submodels of the reduced cell. Achieved 6.
  measure:
    kind: derived_scalar
    field: n_processes
  expect:
    op: range
    low: 6
    high: 6
- name: submodels-are-coupled
  en: Several cell variables are shared by ≥2 submodels — the coupling that makes the model integrated
    (Fig 1B).
  observable: n_stores_coupled
  condition: n_stores_coupled >= 2
  rationale: Integration means submodels communicate through shared cell variables. growth_fraction (metabolism→mass),
    rna_counts (transcription→translation, rna_decay) and protein_counts (translation→protein_decay) are
    each touched by ≥2 processes. Achieved 3.
  measure:
    kind: derived_scalar
    field: n_stores_coupled
  expect:
    op: range
    low: 2
    high: 100
- name: cell-is-viable
  en: The integrated cell runs and stays viable — growth_fraction ≈ 1 at the end of the run (Fig 1).
  observable: growth_fraction_final
  condition: 0.9 <= growth_fraction_final <= 1.1
  rationale: A viable unperturbed cell holds feasible FBA growth (growth_fraction ≈ 1) across the run,
    confirming the submodels compose without stalling. Achieved 1.000.
  measure:
    kind: derived_scalar
    field: growth_fraction_final
  expect:
    op: range
    low: 0.9
    high: 1.1
behavior_tests:
- name: architecture-integrates-six-submodels
  classification: primary
  description: Composite wires exactly six submodel processes.
  measure:
    kind: derived_scalar
    field: n_processes
  pass_if:
    op: range
    low: 6
    high: 6
    provenance:
      kind: model
      note: Reduced viva-Mgen cell = six submodels (metabolism, mass, transcription, translation, rna_decay,
        protein_decay); Fig 1A. Achieved 6.
  requires_simulation: baseline
- name: submodels-are-coupled
  classification: primary
  description: At least two cell variables are shared across ≥2 submodels.
  measure:
    kind: derived_scalar
    field: n_stores_coupled
  pass_if:
    op: range
    low: 2
    high: 100
    provenance:
      kind: theory
      note: Integration = communication through shared cell variables (Fig 1B). 3 stores coupled (growth_fraction,
        rna_counts, protein_counts). Achieved 3.
  requires_simulation: baseline
- name: cell-is-viable
  classification: primary
  description: growth_fraction ≈ 1 at end of the 20 min run.
  measure:
    kind: derived_scalar
    field: growth_fraction_final
  pass_if:
    op: range
    low: 0.9
    high: 1.1
    provenance:
      kind: model
      note: Unperturbed integrated cell holds feasible FBA growth (growth_fraction ≈ 1). Achieved 1.000.
  requires_simulation: baseline
readouts:
- name: mass
  store_path: stores/mass
  status: available
- name: growth_fraction
  store_path: stores/growth_fraction
  status: available
- name: growth_rate
  store_path: stores/growth_rate
  status: available
runs:
- name: baseline
  run_id: fig1-architecture-baseline
  status: completed
  emitter: xarray
  n_steps: 108
  store_path: workspace/studies/fig1-architecture/results/baseline.zarr
  timestamp: 1789259045.0
pipeline_gate:
  prerequisites: []
  enables:
  - fig2-growth
  - fig3-expression
  proceed_condition: 'All six submodels compose into one integrated cell that runs and stays

    viable, with the shared cell variables (Fig 1B wiring) in place. This

    integrated backbone is the substrate the growth (fig2) and expression (fig3)

    studies foreground.

    '
