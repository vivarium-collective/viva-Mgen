schema_version: 4
name: fig6-gene-essentiality
title: "Fig 6A — Single-gene-disruption essentiality: model vs experiment"
created: '2026-09-12'
status: complete
phase: Evaluate

question: |
  Does the viva-Mgen FBA metabolism submodel reproduce Fig 6A — the
  single-gene-disruption essentiality phenotype — for the metabolic genes of
  M. genitalium: does an in-silico single-gene knockout predict which genes are
  essential, matching the reference essentiality calls?
hypothesis: |
  For the ~125 genes the iPS189 metabolic reconstruction covers (the paper notes
  metabolic-gene disruptions are the most debilitating), a single-gene FBA
  knockout that collapses growth should mark the gene essential, and the
  model-vs-reference confusion matrix should land near the paper's whole-cell
  accuracy (~79% overall; ~87% for the iPS189 metabolic model on essentiality).
objective: |
  For every metabolic gene with a reference call, run a single-gene FBA knockout
  via MetabolismFbaReproductionProcess, call it essential when growth_fraction
  drops below 0.05, cross-tabulate against the reference calls into a 2x2
  confusion matrix, and score accuracy, sensitivity, and specificity. Also run
  the fig6_gene_essentiality composite once for a representative essential gene
  (MG_023) to record a canonical baseline and confirm growth collapses.
description: |
  HIGH FIDELITY over the metabolic subset. Essentiality is assessed only for the
  125 genes present in the published Suthers 2009 iPS189 reconstruction that also
  carry a reference essentiality call — not all 525 M. genitalium genes. This is
  the appropriate scope: FBA can only speak to metabolic-gene disruptions, which
  the paper identifies as the most debilitating. A gene is called model-essential
  when its single knockout drives FBA growth_fraction below 0.05 (growth
  collapse). Reference essentiality is the ``essential_ref`` column of
  ``datasets/genes.csv``, extracted from the Karr 2012 repo's
  allDeletionSimulations.json. Achieved (committed production run over 125 genes):
  accuracy 0.760, sensitivity 0.755, specificity 0.789; confusion matrix
  [[TP 80, FN 26], [FP 4, TN 15]] (106 reference-essential, 19 reference-
  non-essential). The representative MG_023 knockout collapses growth_fraction to
  0.000, confirming detection of an essential gene.

baseline:
- name: baseline
  composite: viva_mgen.composites.mgen.mycoplasma_genitalium
  params: {}

variants: []

simulation_set:
- name: baseline
  status: ran
  base_model: viva_mgen.composites.mgen.mycoplasma_genitalium
  duration_min: 1
  seeds:
  - 0
  condition: >-
    Canonical viva-Mgen fig6-gene-essentiality run via sims/run.py (recorded in .pbg/runs.jsonl).
  params: {'disrupted_gene': 'MG_023'}
  readouts:
  - essentiality_accuracy
  - sensitivity
  applies_tests:
  - essentiality-accuracy-high
  - essential-genes-detected

expected_behavior:
- name: essentiality-accuracy-high
  en: "Model-vs-reference essentiality accuracy over the metabolic subset is high (~0.76), in the neighborhood of the paper's whole-cell (79%) and iPS189 metabolic (87%) accuracy."
  observable: essentiality_accuracy
  condition: 0.70 <= essentiality_accuracy <= 1.0
  rationale: >-
    Single-gene FBA knockouts should recover the essentiality classification for
    most metabolic genes. Achieved 0.760 over 125 genes.
  measure: {kind: derived_scalar, field: essentiality_accuracy}
  expect: {op: range, low: 0.70, high: 1.0}
- name: essential-genes-detected
  en: "The model detects most reference-essential metabolic genes (sensitivity ~0.76)."
  observable: sensitivity
  condition: 0.70 <= sensitivity <= 1.0
  rationale: >-
    Reference-essential genes should collapse growth on knockout. Of 106
    reference-essential genes the model calls 80 essential — sensitivity 0.755.
  measure: {kind: derived_scalar, field: sensitivity}
  expect: {op: range, low: 0.70, high: 1.0}

behavior_tests:
- name: essentiality-accuracy-high
  classification: primary
  description: "Model-vs-reference essentiality accuracy over the metabolic subset within [0.70, 1.0]."
  measure: {kind: derived_scalar, field: essentiality_accuracy}
  pass_if:
    op: range
    low: 0.70
    high: 1.0
    provenance:
      kind: experiment
      note: >-
        Gene-essentiality accuracy: 79% overall for the Karr 2012 whole-cell
        model (Fig 6A; Glass et al. 2006 essentiality data), ~87% for the
        iPS189 metabolic model (Suthers et al. 2009). Achieved 0.760 over 125
        metabolic genes with a reference call.
  requires_simulation: baseline
- name: essential-genes-detected
  classification: primary
  description: "Sensitivity (fraction of reference-essential metabolic genes called essential) within [0.70, 1.0]."
  measure: {kind: derived_scalar, field: sensitivity}
  pass_if:
    op: range
    low: 0.70
    high: 1.0
    provenance:
      kind: experiment
      note: >-
        Reference-essential genes should collapse growth on single knockout.
        Achieved sensitivity 0.755 (80 of 106 reference-essential genes detected).
  requires_simulation: baseline

provenance:
  kind: experiment
  note: >-
    Fig 6A of Karr et al. 2012 (single-gene-disruption phenotypes; model vs
    experiment). Whole-cell essentiality accuracy 79% (Glass et al. 2006
    M. genitalium essentiality data); the iPS189 metabolic reconstruction
    (Suthers et al. 2009) predicts metabolic-gene essentiality at ~87%.

readouts:
- name: growth_fraction
  store_path: stores/growth_fraction
  status: available
- name: feasible
  store_path: stores/feasible
  status: available

runs:
- name: baseline
  run_id: fig6-gene-essentiality-baseline
  status: completed
  emitter: xarray
  n_steps: 108
  store_path: workspace/studies/fig6-gene-essentiality/results/baseline.zarr
  timestamp: 1789259045.0

pipeline_gate:
  prerequisites:
  - study: fig2-growth
    condition: tests-passed
  enables:
  - fig7-kinetic-parameters
  proceed_condition: |
    The FBA metabolism submodel reproduces the Fig 6A essentiality phenotype over
    the metabolic subset at ~76% accuracy, validating the single-gene-knockout
    machinery the kinetic-parameter (Fig 7) study builds on.

canonical_runs:
- name: default
  script: workspace/studies/fig6-gene-essentiality/sims/run.py
  args: []
  label: "Fig 6A gene essentiality: single-gene-knockout scan + confusion matrix"
  default: true

visualizations:
- name: confusion-matrix
  chart: viz/confusion_matrix.html
  render: "python sims/run.py"
- name: accuracy-summary
  chart: viz/accuracy_summary.html
  render: "python sims/run.py"

embed_visualizations:
- name: confusion-matrix
  url: /workspace/studies/fig6-gene-essentiality/viz/confusion_matrix.html
  description: "2x2 model-vs-reference essentiality confusion matrix over the 125 metabolic genes (Fig 6A)."
- name: accuracy-summary
  url: /workspace/studies/fig6-gene-essentiality/viz/accuracy_summary.html
  description: "Essentiality prediction performance: accuracy, sensitivity, and specificity as percentages."

conclusion: |
  viva-Mgen reproduces the Fig 6A single-gene-disruption essentiality phenotype
  over the metabolic subset at HIGH fidelity: across the 125 iPS189 metabolic
  genes with a reference essentiality call, single-gene FBA knockouts recover the
  reference classification with 0.760 accuracy (sensitivity 0.755, specificity
  0.789), in the neighborhood of the paper's 79% whole-cell and ~87% iPS189
  metabolic figures. Confusion matrix [[TP 80, FN 26], [FP 4, TN 15]] over 106
  reference-essential and 19 reference-non-essential genes. Essentiality is
  called by growth collapse (growth_fraction < 0.05); the representative MG_023
  knockout collapses growth to 0.000.
