schema_version: 4
name: fig5-energy
title: 'Fig 5 — Global distribution of cellular energy: ATP > GTP synthesis and a translation-dominated
  budget'
created: '2026-09-12'
status: complete
phase: Evaluate
question: 'Does the reduced viva-Mgen cell reproduce Fig 5''s global energy picture — that

  ATP and GTP are the dominant synthesized carriers with ATP > GTP (Fig 5A), and

  that the cellular energy budget is dominated by translation, ahead of

  transcription (Fig 5D)?

  '
hypothesis: 'FBA over iPS189 should carry far more flux through ATP synthase (ATPS4r) than

  through the GTP-producing kinases, giving ATP > GTP > 0. And because each

  peptide bond costs ~2 GTP and translation events vastly outnumber transcription

  events (mRNA accumulates and each transcript is translated many times over),

  the modeled expression energy should be overwhelmingly translation, matching

  the ordering translation >> transcription in Fig 5D.

  '
objective: 'Run the fig5_energy composite for one hour (metabolism/mass at 60 s,

  expression at 1 s) to time-average ATP/GTP production, then step the

  transcription and translation processes directly for one hour to tally their

  NTP/GTP consumption, and compute the modeled energy shares and the ATP:GTP

  synthesis ratio.

  '
description: 'REDUCED FIDELITY. Of the energy carriers only ATP and GTP are modeled — NAD,

  FAD and NADP are not — and the process energy shares are computed only from the

  two reduced expression processes actually wired in the composite: transcription

  (NTP) and translation (GTP). tRNA-aminoacylation, the ~15% second slice of the

  paper''s budget, is not a separate process here. The study therefore reproduces

  the QUALITATIVE Fig 5 findings — the ATP > GTP synthesis ordering (Fig 5A) and

  the translation-dominated expression budget (Fig 5D) — but NOT the exact

  29% / 15% / 7% / 44% split. Achieved (committed production run): ATP:GTP

  synthesis ratio 4.03 (ATP flux 0.813 vs GTP flux 0.202, iPS189 units), and of

  the modeled expression energy translation is 96.8% vs transcription 3.2%

  (9.83M GTP vs 0.32M NTP over the hour). The Fig 5D donut additionally shows a

  representative ~44% "unaccounted" slice to echo the paper''s structure; it is a

  fixed illustrative value, not a measured quantity of this reduced model.

  '
baseline:
- name: baseline
  composite: viva_mgen.composites.mgen.mycoplasma_genitalium
  params: {}
variants: []
simulation_set:
- name: baseline
  status: ran
  base_model: viva_mgen.composites.mgen.mycoplasma_genitalium
  duration_min: 60
  seeds:
  - 0
  condition: Canonical viva-Mgen fig5-energy run via sims/run.py (recorded in .pbg/runs.jsonl).
  readouts:
  - atp_to_gtp_ratio
  - translation_share
  applies_tests:
  - atp-exceeds-gtp-synthesis
  - translation-dominates-energy
expected_behavior:
- name: atp-exceeds-gtp-synthesis
  en: ATP:GTP synthesis-flux ratio in [2,8] (ATP the dominant energy carrier).
  observable: atp_to_gtp_ratio
  condition: 2.0 <= atp_to_gtp_ratio <= 8.0
  rationale: 'Fig 5A: ATP and GTP are the dominant synthesized carriers with ATP > GTP; iPS189 FBA gives
    ~4.0.'
  measure:
    kind: derived_scalar
    field: atp_to_gtp_ratio
  expect:
    op: range
    low: 2.0
    high: 8.0
- name: atp-gtp-dominate-redox
  en: ATP+GTP synthesized >1000x the redox carriers (NAD(P)H, FADH2).
  observable: atp_gtp_to_redox_ratio
  condition: 1000.0 <= atp_gtp_to_redox_ratio <= 1000000000000.0
  rationale: 'Fig 5A: ATP/GTP synthesis is >1000x that of NAD(H)/NADP(H)/FAD(H2). (Our reduced FBA measures
    GROSS carrier turnover, where redox recycling is large — expected to fall short until net-synthesis
    accounting is added.)'
  measure:
    kind: derived_scalar
    field: atp_gtp_to_redox_ratio
  expect:
    op: range
    low: 1000.0
    high: 1000000000000.0
- name: translation-largest-energy-consumer
  en: Translation is the largest ATP+GTP consumer (~29% of total).
  observable: translation_energy_share
  condition: 0.2 <= translation_energy_share <= 0.4
  rationale: 'Fig 5D: Translation = 29.0% of average ATP+GTP usage.'
  measure:
    kind: derived_scalar
    field: translation_energy_share
  expect:
    op: range
    low: 0.2
    high: 0.4
- name: aminoacylation-energy-share
  en: tRNA aminoacylation is the second-largest consumer (~15%).
  observable: aminoacylation_energy_share
  condition: 0.1 <= aminoacylation_energy_share <= 0.22
  rationale: 'Fig 5D: tRNA aminoacylation = 15.1% of ATP+GTP usage.'
  measure:
    kind: derived_scalar
    field: aminoacylation_energy_share
  expect:
    op: range
    low: 0.1
    high: 0.22
- name: transcription-energy-share
  en: Transcription consumes ~7% of ATP+GTP.
  observable: transcription_energy_share
  condition: 0.04 <= transcription_energy_share <= 0.12
  rationale: 'Fig 5D: Transcription = 7.1% of ATP+GTP usage. (Reduced-panel transcription accounting currently
    under-counts NTP relative to translation.)'
  measure:
    kind: derived_scalar
    field: transcription_energy_share
  expect:
    op: range
    low: 0.04
    high: 0.12
- name: unaccounted-energy-gap
  en: A ~44% model-vs-experiment unaccounted energy gap is carried through.
  observable: unaccounted_share
  condition: 0.35 <= unaccounted_share <= 0.5
  rationale: 'Fig 5D: 44.3% of experimentally-observed energy production is unaccounted for by the model
    — a genuine reported discrepancy.'
  measure:
    kind: derived_scalar
    field: unaccounted_share
  expect:
    op: range
    low: 0.35
    high: 0.5
- name: ntp-use-invariant-across-cells
  en: Total NTP use is nearly invariant across cell-cycle length (low CV).
  observable: ntp_use_cv_across_cells
  condition: 0.0 <= ntp_use_cv_across_cells <= 0.15
  rationale: 'Fig 5B: total ATP/GTP use is nearly invariant across cells except the very slowest — metabolism
    (not expression) sets cycle length.'
  measure:
    kind: derived_scalar
    field: ntp_use_cv_across_cells
  expect:
    op: range
    low: 0.0
    high: 0.15
behavior_tests:
- name: atp-exceeds-gtp-synthesis
  classification: primary
  description: ATP:GTP synthesis-flux ratio in [2,8] (ATP the dominant energy carrier).
  measure:
    kind: derived_scalar
    field: atp_to_gtp_ratio
  pass_if:
    op: range
    low: 2.0
    high: 8.0
    provenance:
      kind: model
      note: 'Fig 5A: ATP and GTP are the dominant synthesized carriers with ATP > GTP; iPS189 FBA gives
        ~4.0.'
  requires_simulation: baseline
