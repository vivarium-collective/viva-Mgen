- name: fig5-a-synthesis
  url: /workspace/studies/fig5-energy/viz/fig5_a_synthesis.html
  description: 'Fig 5A: ATP/GTP/redox-carrier synthesis rate over the cell cycle (log; ATP/GTP ~1000×
    redox, roughly flat).'
- name: fig5-b-population
  url: /workspace/studies/fig5-energy/viz/fig5_b_population.html
  description: 'Fig 5B: total ATP/GTP use vs cell-cycle length across cells — near-invariant.'
- name: fig5-c-by-process
  url: /workspace/studies/fig5-energy/viz/fig5_c_by_process.html
  description: 'Fig 5C: energy-use rate over the cycle broken down by process (real per-process consumption).'
- name: fig5-d-allocation
  url: /workspace/studies/fig5-energy/viz/fig5_d_allocation.html
  description: 'Fig 5D: average ATP+GTP allocation — real accounted split plus the paper''s genuine ~44.3%
    unaccounted gap.'
provenance:
  kind: experiment/model
  note: 'Karr et al. 2012 Fig 5A (ATP/GTP dominate the synthesized energy carriers, ATP > GTP) and Fig
    5D (energy budget dominated by translation ~29%, then tRNA-aminoacylation ~15%, then transcription
    ~7%, with ~44% unaccounted). Reduced reproduction: only ATP/GTP carriers and only the transcription/
    translation expression processes are modeled.'
conclusion: 'The viva-Mgen cell reproduces Fig 5''s qualitative energy picture at reduced

  fidelity. Fig 5A: ATP synthesis flux (0.813) exceeds GTP (0.202) by 4.03×, both

  positive — ATP and GTP are the dominant synthesized carriers. Fig 5D: of the

  modeled expression energy, translation takes 96.8% (9.83M GTP/h) versus

  transcription''s 3.2% (0.32M NTP/h), reproducing the translation >> transcription

  ordering. Caveat: only ATP/GTP among carriers are modeled and only transcription/

  translation contribute to the tallied budget — NAD/FAD/NADP and tRNA-aminoacylation

  are absent — so the reduced shares (96.8/3.2 of modeled energy) diverge from the

  paper''s exact 29/15/7/44 whole-cell split. The Fig 5D donut''s ~44% "unaccounted"

  slice is a fixed representative value shown only to echo the paper''s structure.

  '
