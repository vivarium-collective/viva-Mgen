schema_version: 4
name: fig4-cell-cycle
title: "Fig 4 — Emergent, unregulated control of cell-cycle duration"
created: '2026-09-12'
status: complete
phase: Evaluate

question: |
  Does the viva-mGen replication submodel reproduce Fig 4's central finding —
  that M. genitalium's cell-cycle duration is controlled *emergently*, without a
  dedicated genetic regulator, through the coupling of replication initiation and
  a dNTP surplus that it builds up?
hypothesis: |
  If DnaA accumulates stochastically to trigger initiation while dNTPs
  accumulate (unconsumed) during that same initiation phase, then across single
  cells (1) more birth DnaA shortens initiation (Fig 4C), (2) a larger dNTP pool
  at replication start shortens replication (Fig 4D), and (3) initiation and
  replication durations are inversely correlated (Fig 4E) — a longer initiation
  buys a bigger dNTP surplus that speeds replication, buffering total cycle length.
objective: |
  Simulate a population of ~128 single cells with random birth DnaA and dNTP
  levels by stepping the ReplicationReproductionProcess directly, recover the
  three Fig 4 single-cell correlations, and render a representative single-cell
  dynamics trajectory through the fig4_cell_cycle composite.
description: |
  REDUCED MECHANISM, GENUINE DYNAMICS. This is a clean-room reproduction of the
  emergent cell-cycle regulation Karr 2012 uncovered, not the full
  replisome/Okazaki-fragment machinery of the original Replication submodel. The
  mechanism is genuine: a dNTP-buffered three-phase cycle (initiation ->
  replication -> done) in which DnaA accumulates stochastically to a threshold to
  fire initiation, dNTPs accumulate unconsumed during initiation, and the
  resulting surplus sets the speed of the deterministic, dNTP-limited replication
  phase. No gene explicitly regulates cycle length; the buffering is emergent
  from that coupling. Achieved (committed production run, 128/128 cells
  completing): r(initiation, replication) = -0.930 (Fig 4E),
  r(dNTP-at-start, replication) = -0.951 (Fig 4D),
  r(initial DnaA, initiation) = -0.743 (Fig 4C).

baseline:
- name: baseline
  composite: viva_mgen.composites.cell_cycle.fig4_cell_cycle
  params: {initial_dnaA: 5, initial_dntp: 0, seed: 0}

variants: []

expected_behavior:
- name: initiation-replication-inversely-correlated
  en: "Across single cells, initiation and replication durations are inversely correlated (Fig 4E)."
  observable: r_init_repl
  condition: -1.0 <= r_init_repl <= -0.2
  rationale: >-
    dNTPs accumulate unconsumed during initiation, so a longer initiation builds a
    larger surplus that speeds the subsequent replication — buffering total cycle
    length. Achieved r = -0.930.
  measure: {kind: derived_scalar, field: r_init_repl}
  expect: {op: range, low: -1.0, high: -0.7}
- name: dntp-controls-replication-duration
  en: "A higher dNTP pool at the start of replication shortens replication (Fig 4D)."
  observable: r_dntp_repl
  condition: -1.0 <= r_dntp_repl <= -0.2
  rationale: >-
    Replication is dNTP-limited; a larger starting pool lets polymerase run nearer
    its rate cap, finishing sooner. Achieved r = -0.951.
  measure: {kind: derived_scalar, field: r_dntp_repl}
  expect: {op: range, low: -1.0, high: -0.7}
- name: more-dnaa-shortens-initiation
  en: "More DnaA present at birth shortens replication-initiation duration (Fig 4C)."
  observable: r_dnaA_init
  condition: -1.0 <= r_dnaA_init <= -0.2
  rationale: >-
    Initiation fires when DnaA reaches a fixed threshold; starting closer to it
    means less to accumulate. Achieved r = -0.743.
  measure: {kind: derived_scalar, field: r_dnaA_init}
  expect: {op: range, low: -1.0, high: -0.4}

behavior_tests:
- name: initiation-replication-inversely-correlated
  classification: primary
  description: "Pearson r(initiation_duration, replication_duration) is clearly negative (Fig 4E)."
  measure: {kind: derived_scalar, field: r_init_repl}
  pass_if:
    op: range
    low: -1.0
    high: -0.7
    provenance:
      kind: model
      note: "Karr 2012 Fig 4E — inverse initiation↔replication duration control; achieved r = -0.930."
  requires_simulation: baseline
- name: dntp-controls-replication-duration
  classification: primary
  description: "Pearson r(dntp_at_replication_start, replication_duration) is clearly negative (Fig 4D)."
  measure: {kind: derived_scalar, field: r_dntp_repl}
  pass_if:
    op: range
    low: -1.0
    high: -0.7
    provenance:
      kind: model
      note: "Karr 2012 Fig 4D — higher starting dNTP shortens replication; achieved r = -0.951."
  requires_simulation: baseline
- name: more-dnaa-shortens-initiation
  classification: primary
  description: "Pearson r(initial_dnaA, initiation_duration) is clearly negative (Fig 4C)."
  measure: {kind: derived_scalar, field: r_dnaA_init}
  pass_if:
    op: range
    low: -1.0
    high: -0.4
    provenance:
      kind: model
      note: "Karr 2012 Fig 4C — more initial DnaA shortens initiation; achieved r = -0.743."
  requires_simulation: baseline

pipeline_gate:
  prerequisites:
  - study: fig1-architecture
    condition: tests-passed
  enables: []
  proceed_condition: |
    All three Fig 4 single-cell correlations come out clearly negative, showing
    the emergent, genetically-unregulated buffering of cell-cycle duration is
    reproduced by the reduced dNTP-coupled mechanism.

canonical_runs:
- name: default
  script: workspace/studies/fig4-cell-cycle/sims/run.py
  args: []
  label: "Fig 4 cell cycle: 128-cell population + representative trajectory"
  default: true

visualizations:
- name: init-vs-repl
  chart: viz/init_vs_repl.html
  render: "python sims/run.py"
- name: dntp-vs-repl
  chart: viz/dntp_vs_repl.html
  render: "python sims/run.py"
- name: cell-cycle-trajectory
  chart: viz/cell_cycle_trajectory.html
  render: "python sims/run.py"

embed_visualizations:
- name: init-vs-repl
  url: /studies/fig4-cell-cycle/viz/init_vs_repl.html
  description: "Initiation vs replication duration across 128 single cells — inversely correlated (Fig 4E)."
- name: dntp-vs-repl
  url: /studies/fig4-cell-cycle/viz/dntp_vs_repl.html
  description: "dNTP pool at replication start vs replication duration — higher surplus, faster replication (Fig 4D)."
- name: cell-cycle-trajectory
  url: /studies/fig4-cell-cycle/viz/cell_cycle_trajectory.html
  description: "One representative cell through the three-phase cycle: replicated fraction, dNTP pool, DnaA complex vs time (Fig 4B)."

conclusion: |
  viva-mGen reproduces Fig 4's emergent cell-cycle regulation with a reduced but
  mechanistically genuine dNTP-buffered replication model. Across 128 single
  cells (all completing), the three signature correlations are clearly negative:
  more birth DnaA shortens initiation (r = -0.743, Fig 4C), a larger starting
  dNTP pool shortens replication (r = -0.951, Fig 4D), and initiation and
  replication durations are inversely related (r = -0.930, Fig 4E) — the
  self-buffering of total cycle length that arises without any dedicated genetic
  regulator.
