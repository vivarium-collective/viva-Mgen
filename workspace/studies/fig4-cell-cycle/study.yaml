schema_version: 4
name: fig4-cell-cycle
parent_studies:
- parca-parameter-fitting
title: Fig 4 — Emergent, unregulated control of cell-cycle duration
created: '2026-09-12'
status: complete
phase: Evaluate
question: 'Does the viva-Mgen replication submodel reproduce Fig 4''s central finding —

  that M. genitalium''s cell-cycle duration is controlled *emergently*, without a

  dedicated genetic regulator, through the coupling of replication initiation and

  a dNTP surplus that it builds up?

  '
hypothesis: 'If DnaA accumulates stochastically to trigger initiation while dNTPs

  accumulate (unconsumed) during that same initiation phase, then across single

  cells (1) more birth DnaA shortens initiation (Fig 4C), (2) a larger dNTP pool

  at replication start shortens replication (Fig 4D), and (3) initiation and

  replication durations are inversely correlated (Fig 4E) — a longer initiation

  buys a bigger dNTP surplus that speeds replication, buffering total cycle length.

  '
objective: 'Simulate a population of ~128 single cells with random birth DnaA and dNTP

  levels by stepping the ReplicationReproductionProcess directly, recover the

  three Fig 4 single-cell correlations, and render a representative single-cell

  dynamics trajectory through the fig4_cell_cycle composite.

  '
description: 'REDUCED MECHANISM, GENUINE DYNAMICS. This is a clean-room reproduction of the

  emergent cell-cycle regulation Karr 2012 uncovered, not the full

  replisome/Okazaki-fragment machinery of the original Replication submodel. The

  mechanism is genuine: a dNTP-buffered three-phase cycle (initiation ->

  replication -> done) in which DnaA accumulates stochastically to a threshold to

  fire initiation, dNTPs accumulate unconsumed during initiation, and the

  resulting surplus sets the speed of the deterministic, dNTP-limited replication

  phase. No gene explicitly regulates cycle length; the buffering is emergent

  from that coupling. Achieved (committed production run, 128/128 cells

  completing): r(initiation, replication) = -0.930 (Fig 4E),

  r(dNTP-at-start, replication) = -0.951 (Fig 4D),

  r(initial DnaA, initiation) = -0.743 (Fig 4C).

  '
baseline:
- name: baseline
  composite: viva_mgen.composites.mgen.mycoplasma_genitalium
  params:
    initial_dnaA: 5
    initial_dntp: 0
    seed: 0
variants: []
simulation_set:
- name: baseline
  status: ran
  base_model: viva_mgen.composites.mgen.mycoplasma_genitalium
  duration_min: 60
  seeds:
  - 0
  condition: Canonical viva-Mgen fig4-cell-cycle run via sims/run.py (recorded in .pbg/runs.jsonl).
  params:
    initial_dnaA: 5
    initial_dntp: 0
    seed: 0
  readouts:
  - r_init_repl
  - r_dntp_repl
  - r_dnaA_init
  applies_tests:
  - initiation-replication-inversely-correlated
  - dntp-controls-replication-duration
  - more-dnaa-shortens-initiation
expected_behavior:
- name: cell-cycle-duration-9h
  en: Total cell-cycle duration ≈ 9 h (Fig 4A).
  observable: cell_cycle_h
  condition: 8.5 <= cell_cycle_h <= 9.5
  rationale: 'Karr 2012: 9.0 h cell cycle (median in-silico doubling 8.9 h; Fig 2B/4A).'
  measure:
    kind: derived_scalar
    field: cell_cycle_h
  expect:
    op: range
    low: 8.5
    high: 9.5
- name: initiation-duration-3.6h
  en: Replication-initiation duration ≈ 3.6 h (Fig 4A).
  observable: init_dur_h
  condition: 3.0 <= init_dur_h <= 4.2
  rationale: 'Karr 2012 Time state: replicationInitiationDuration = 12960 s ≈ 3.6 h.'
  measure:
    kind: derived_scalar
    field: init_dur_h
  expect:
    op: range
    low: 3.0
    high: 4.2
- name: replication-duration-4.33h
  en: Replication duration ≈ 4.33 h (Fig 4A).
  observable: repl_dur_h
  condition: 3.8 <= repl_dur_h <= 4.9
  rationale: 'Karr 2012 Time state: replicationDuration = 15571 s ≈ 4.33 h.'
  measure:
    kind: derived_scalar
    field: repl_dur_h
  expect:
    op: range
    low: 3.8
    high: 4.9
- name: cytokinesis-duration-1.08h
  en: Cytokinesis duration ≈ 1.08 h (Fig 4A).
  observable: cyto_dur_h
  condition: 0.9 <= cyto_dur_h <= 1.3
  rationale: 'Karr 2012 Time state: cytokinesisDuration = 3869 s ≈ 1.08 h.'
  measure:
    kind: derived_scalar
    field: cyto_dur_h
  expect:
    op: range
    low: 0.9
    high: 1.3
- name: replication-duration-variable
  en: Replication-duration cell-to-cell CV is high (~38.5%; Fig 4A).
  observable: cv_repl_pct
  condition: 25 <= cv_repl_pct <= 55
  rationale: 'Karr 2012 Fig 4A: replication-duration CV = 38.5% across 128 cells.'
  measure:
    kind: derived_scalar
    field: cv_repl_pct
  expect:
    op: range
    low: 25
    high: 55
- name: total-cycle-less-variable-than-phases
  en: The whole cell cycle is LESS variable than its individual phases (Fig 4A).
  observable: total_cv_below_phase_cvs
  condition: 1.0 <= total_cv_below_phase_cvs <= 1.0
  rationale: 'Karr 2012 Fig 4A: cycle CV 9.4% < initiation 64.3% and replication 38.5% — emergent buffering.'
  measure:
    kind: derived_scalar
    field: total_cv_below_phase_cvs
  expect:
    op: range
    low: 1.0
    high: 1.0
- name: initiation-replication-inversely-correlated
  en: Initiation and replication durations are inversely correlated (Fig 4E).
  observable: r_init_repl
  condition: -1.0 <= r_init_repl <= -0.7
  rationale: 'Karr 2012 Fig 4E: longer initiation → shorter replication (dNTP-surplus buffering).'
  measure:
    kind: derived_scalar
    field: r_init_repl
  expect:
    op: range
    low: -1.0
    high: -0.7
- name: more-dnaa-shortens-initiation
  en: Initial DnaA count vs initiation duration is negatively correlated (Fig 4C).
  observable: r_dnaA_init
  condition: -1.0 <= r_dnaA_init <= -0.35
  rationale: 'Karr 2012 Fig 4C: initial DnaA vs initiation duration, R² ≈ 0.49 (r ≈ -0.7).'
  measure:
    kind: derived_scalar
    field: r_dnaA_init
  expect:
    op: range
    low: -1.0
    high: -0.35
- name: dntp-controls-replication-duration
  en: dNTP at replication start vs replication duration is negative (Fig 4D).
  observable: r_dntp_repl
  condition: -1.0 <= r_dntp_repl <= -0.7
  rationale: 'Karr 2012 Fig 4D: higher dNTP at replication start → shorter replication.'
  measure:
    kind: derived_scalar
    field: r_dntp_repl
  expect:
    op: range
    low: -1.0
    high: -0.7
