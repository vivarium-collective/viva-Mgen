    provenance:
      kind: experiment
      note: RNA is ≈9% of dry mass (Karr 2012 Fig 2C / Morowitz 1962). Test the RNA dry-mass fraction
        is in [0.05, 0.15].
  requires_simulation: baseline
- name: dna-doubles-in-s-phase
  classification: primary
  description: DNA content doubles 1→2 over the cycle as the chromosome replicates (Fig 2D).
  measure:
    kind: derived_scalar
    field: dna_fold_change
  pass_if:
