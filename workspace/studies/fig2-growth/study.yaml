  requires_simulation: baseline
- name: mrna-low-copy-bursty
  classification: primary
  description: Single-cell mRNA is low-copy (~0–2 per gene), bursty (Fig 2G).
  measure:
    kind: derived_scalar
    field: mean_mrna_per_gene
  pass_if:
    op: range
    low: 0.0
    high: 2.5
    provenance:
      kind: experiment
      note: mRNA is present at low, discrete copy numbers (0–2 per gene) due to short half-lives and bursty
        synthesis (Karr 2012 Fig 2G). Test mean mRNA per gene ≤2.5.
  requires_simulation: baseline
- name: mrna-protein-decoupled
  classification: primary
  description: Across cells, mRNA and protein copy numbers are uncorrelated (Fig 2H).
  measure:
    kind: derived_scalar
    field: mrna_protein_abs_corr
  pass_if:
    op: range
    low: 0.0
    high: 0.4
    provenance:
      kind: experiment
      note: Single-cell mRNA (transient, bursty) and protein (cumulative, long-lived) copy numbers are
        decoupled — no correlation across a population (Karr 2012 Fig 2H). Test |Pearson r| < 0.4.
  requires_simulation: baseline
- name: emergent-mass-protein-fraction
  classification: secondary
  description: Emergent protein fraction of macromolecular dry mass ≈ 0.70 (Karr 2012 composition).
  measure:
    kind: derived_scalar
    field: emergent_protein_fraction
  pass_if:
