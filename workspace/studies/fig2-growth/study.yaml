    provenance:
      kind: model
      note: Division now fires when the emergent Σ(species×MW) inventory doubles, so the cycle length
        emerges from synthesis rates (not the imposed growth-law μ). Reduced model predicts ~6 h — biomass
        synthesis outpaces the ~9 h replication cycle by ~1.5× (documented rate/cycle- coordination gap).
        Test the emergent prediction is in the plausible [4, 12] h.
