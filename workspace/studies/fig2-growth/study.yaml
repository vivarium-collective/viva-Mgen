    provenance:
      kind: experiment
      note: 'Karr 2012 cell composition: protein 0.62 of total dry mass; emergent Σ(species×MW), macromolecule-renormalized
        target ≈0.70.'
  requires_simulation: baseline
- name: emergent-mass-dna-fraction
  classification: secondary
  description: Emergent DNA fraction of macromolecular dry mass ≈ 0.19 (Karr 2012 composition).
  measure:
    kind: derived_scalar
    field: emergent_dna_fraction
  pass_if:
    op: range
    low: 0.1
    high: 0.35
    provenance:
      kind: experiment
      note: 'Karr 2012 cell composition: DNA 0.169 of total dry mass (0.192 renormalized over protein+DNA+RNA);
        emergent Σ(species×MW).'
  requires_simulation: baseline
- name: emergent-mass-rna-fraction
