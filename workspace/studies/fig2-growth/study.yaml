    provenance:
      kind: experiment
      note: 'Dry-mass composition is protein-dominant: protein ≈62–75% (Karr 2012 Fig 2C vs Morowitz 1962).
        Test the protein dry-mass fraction is in [0.62, 0.75].'
  requires_simulation: baseline
- name: rna-fraction-small
  classification: secondary
  description: RNA is a small dry-mass fraction (~5–15%), consistent with Fig 2C.
  measure:
    kind: derived_scalar
    field: rna_fraction
  pass_if:
