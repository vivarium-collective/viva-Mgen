schema_version: 4
name: fig2-growth
parent_studies:
- parca-parameter-fitting
title: 'Fig 2 — Cell growth: 9 h doubling time and protein-dominant composition'
created: '2026-09-12'
status: complete
phase: Evaluate
question: 'Does the reduced-but-genuine viva-Mgen cell (FBA metabolism over iPS189

  driving mass accumulation) reproduce the trained whole-cell model''s core

  growth phenotype from Fig 2 — a ~9 h doubling time and a protein-dominant

  dry-mass composition?

  '
hypothesis: 'With growth calibrated to the model''s fitted cell-cycle length (32400 s) and

  the fitted dry-mass fractions from parameters.json, the integrated cell should

  double its mass in ~9 h and show ~62% protein by dry mass, matching Fig 2A/B

  (doubling time) and Fig 2C (composition).

  '
objective: 'Run the fig2_growth composite (metabolism + mass) for one cell cycle, fit the

  exponential growth rate to recover the doubling time, confirm mass doubles over

  the cycle, and read out the dry-mass composition at division.

  '
description: 'FULL FIDELITY for the growth/composition phenotype. Metabolism is real FBA on

  the published Suthers 2009 iPS189 reconstruction; mass integration uses the

  Karr 2012 fitted cell-cycle length and dry-weight fractions. The metabolism

  growth flux is calibrated so unperturbed growth (growth_fraction = 1.0) doubles

  the cell in the fitted 9 h — the same doubling time measured for M. genitalium

  and reproduced in Fig 2A/B. Achieved (committed production run): doubling time

  9.000 h, mass ratio 2.000 over the cycle, protein fraction 0.620 of dry mass.

  '
baseline:
- name: baseline
  composite: viva_mgen.composites.mgen.mycoplasma_genitalium
  params: {}
variants: []
simulation_set:
- name: baseline
  status: ran
  base_model: viva_mgen.composites.mgen.mycoplasma_genitalium
  duration_min: 540
  seeds:
  - 0
  condition: Canonical viva-Mgen fig2-growth run via sims/run.py (recorded in .pbg/runs.jsonl).
  readouts:
  - doubling_time_h
  - final_mass_ratio
  - protein_fraction
  applies_tests:
  - doubling-time-near-9h
  - mass-doubles-in-cycle
  - protein-dominant-composition
expected_behavior:
- name: doubling-time-near-9h
  en: The population median doubling time is ≈8.9 h, matching measured M. genitalium (Fig 2A/B).
  observable: doubling_time_h
  condition: 8.3 <= doubling_time_h <= 9.5
  rationale: M. genitalium doubling time τ ≈ 9.0 h measured (Fig 2A); the simulated median is 8.9 h (Fig
    2B). Test the exponential-fit doubling time falls in [8.3, 9.5] h.
  measure:
    kind: derived_scalar
    field: doubling_time_h
  expect:
    op: range
    low: 8.3
    high: 9.5
- name: mass-doubles-over-cycle
  en: Dry mass doubles over one cell cycle (Fig 2B).
  observable: final_mass_ratio
  condition: 1.8 <= final_mass_ratio <= 2.2
  rationale: A cell doubles its mass between birth and division (Karr 2012 Fig 2B). Test mass fold-change
    ≈2 over the 9 h cycle.
  measure:
    kind: derived_scalar
    field: final_mass_ratio
  expect:
    op: range
    low: 1.8
    high: 2.2
- name: protein-dominant-composition
  en: Protein is the dominant dry-mass component (~62–75%), matching Morowitz 1962 (Fig 2C).
  observable: protein_fraction
  condition: 0.62 <= protein_fraction <= 0.75
  rationale: 'Dry-mass composition is protein-dominant: protein ≈62–75% (Karr 2012 Fig 2C vs Morowitz
    1962). Test the protein dry-mass fraction is in [0.62, 0.75].'
  measure:
    kind: derived_scalar
    field: protein_fraction
  expect:
    op: range
    low: 0.62
    high: 0.75
- name: rna-fraction-small
  en: RNA is a small dry-mass fraction (~5–15%), consistent with Fig 2C.
  observable: rna_fraction
  condition: 0.05 <= rna_fraction <= 0.15
  rationale: RNA is ≈9% of dry mass (Karr 2012 Fig 2C / Morowitz 1962). Test the RNA dry-mass fraction
    is in [0.05, 0.15].
  measure:
    kind: derived_scalar
    field: rna_fraction
  expect:
    op: range
    low: 0.05
    high: 0.15
- name: dna-doubles-in-s-phase
  en: DNA content doubles 1→2 over the cycle as the chromosome replicates (Fig 2D).
  observable: dna_fold_change
  condition: 1.8 <= dna_fold_change <= 2.2
  rationale: Single-cell DNA content steps from 1× to 2× during S-phase (Karr 2012 Fig 2D). Test DNA fold-change
    ≈2 over the cycle.
  measure:
    kind: derived_scalar
    field: dna_fold_change
  expect:
    op: range
    low: 1.8
    high: 2.2
- name: mrna-low-copy-bursty
  en: Single-cell mRNA is low-copy (~0–2 per gene), bursty (Fig 2G).
  observable: mean_mrna_per_gene
  condition: 0.0 <= mean_mrna_per_gene <= 2.5
  rationale: mRNA is present at low, discrete copy numbers (0–2 per gene) due to short half-lives and
    bursty synthesis (Karr 2012 Fig 2G). Test mean mRNA per gene ≤2.5.
  measure:
    kind: derived_scalar
    field: mean_mrna_per_gene
  expect:
    op: range
    low: 0.0
    high: 2.5
- name: mrna-protein-decoupled
  en: Across cells, mRNA and protein copy numbers are uncorrelated (Fig 2H).
  observable: mrna_protein_abs_corr
  condition: 0.0 <= mrna_protein_abs_corr <= 0.4
  rationale: Single-cell mRNA (transient, bursty) and protein (cumulative, long-lived) copy numbers are
    decoupled — no correlation across a population (Karr 2012 Fig 2H). Test |Pearson r| < 0.4.
  measure:
    kind: derived_scalar
    field: mrna_protein_abs_corr
  expect:
    op: range
    low: 0.0
    high: 0.4
- name: emergent-mass-protein-fraction
  en: Emergent (Σ species×MW) protein fraction of macromolecular dry mass is plausible (Karr 2012 composition).
  observable: emergent_protein_fraction
  condition: 0.55 <= emergent_protein_fraction <= 0.80
  rationale: Karr 2012 cell composition puts protein at 0.62 of total dry mass; emergent Σ(species×MW),
    macromolecule-renormalized target ≈0.70. Test the emergent protein fraction falls in [0.55, 0.80].
  measure:
    kind: derived_scalar
    field: emergent_protein_fraction
  expect:
    op: range
    low: 0.55
    high: 0.8
- name: emergent-mass-dna-fraction
  en: Emergent (Σ species×MW) DNA fraction of macromolecular dry mass is plausible (Karr 2012 composition).
  observable: emergent_dna_fraction
  condition: 0.10 <= emergent_dna_fraction <= 0.35
  rationale: Karr 2012 cell composition puts DNA at 0.169 of total dry mass (0.192 renormalized over protein+DNA+RNA).
    Test the emergent DNA fraction falls in [0.10, 0.35].
  measure:
    kind: derived_scalar
    field: emergent_dna_fraction
  expect:
    op: range
    low: 0.1
    high: 0.35
- name: emergent-mass-rna-fraction
  en: Emergent (Σ species×MW) RNA fraction of macromolecular dry mass is plausible (Karr 2012 composition).
  observable: emergent_rna_fraction
  condition: 0.05 <= emergent_rna_fraction <= 0.25
  rationale: Karr 2012 cell composition puts RNA at 0.093 of total dry mass (0.106 renormalized over protein+DNA+RNA).
    Test the emergent RNA fraction falls in [0.05, 0.25].
  measure:
    kind: derived_scalar
    field: emergent_rna_fraction
  expect:
    op: range
    low: 0.05
    high: 0.25
- name: single-cell-mrna-variation
  en: Cell-to-cell CV of total mRNA is nonzero and plausible (Fig 2 single-cell distributions).
  observable: single_cell_mrna_cv
  condition: 0.001 <= single_cell_mrna_cv <= 1.5
  rationale: Karr 2012 Fig 2 single-cell distributions show bursty low-copy single-cell mRNA, hence nonzero
    cell-to-cell variation. Test the CV of total mRNA across independent cells falls in [0.001, 1.5].
  measure:
    kind: derived_scalar
    field: single_cell_mrna_cv
  expect:
    op: range
    low: 0.001
    high: 1.5
- name: emergent-cell-cycle-length
  en: The cell-cycle length PREDICTED from the synthesized inventory (time the emergent Σ(species×MW)
    mass doubles and division fires) is biologically plausible.
  observable: emergent_doubling_time_h
  condition: 4.0 <= emergent_doubling_time_h <= 12.0
  rationale: 'Gap 2b (phenotype from genotype): division now fires when the EMERGENT macromolecule inventory
    doubles, so the cycle length emerges from the synthesis rates rather than the imposed growth-law μ.
    The reduced model predicts ~6 h — faster than the measured/calibrated ~9 h cycle, because biomass
    synthesis currently outpaces replication by ~1.5×; a documented rate/cycle- coordination gap. Test
    the emergent prediction is in the biologically plausible [4, 12] h.'
  measure:
    kind: derived_scalar
    field: emergent_doubling_time_h
  expect:
    op: range
    low: 4.0
    high: 12.0
behavior_tests:
- name: doubling-time-near-9h
  classification: primary
  description: The population median doubling time is ≈8.9 h, matching measured M. genitalium (Fig 2A/B).
  measure:
    kind: derived_scalar
    field: doubling_time_h
  pass_if:
    op: range
    low: 8.3
    high: 9.5
    provenance:
      kind: experiment
      note: M. genitalium doubling time τ ≈ 9.0 h measured (Fig 2A); the simulated median is 8.9 h (Fig
        2B). Test the exponential-fit doubling time falls in [8.3, 9.5] h.
  requires_simulation: baseline
- name: mass-doubles-over-cycle
  classification: primary
  description: Dry mass doubles over one cell cycle (Fig 2B).
  measure:
    kind: derived_scalar
    field: final_mass_ratio
  pass_if:
    op: range
    low: 1.8
    high: 2.2
    provenance:
      kind: model
      note: A cell doubles its mass between birth and division (Karr 2012 Fig 2B). Test mass fold-change
        ≈2 over the 9 h cycle.
  requires_simulation: baseline
- name: protein-dominant-composition
  classification: primary
  description: Protein is the dominant dry-mass component (~62–75%), matching Morowitz 1962 (Fig 2C).
  measure:
    kind: derived_scalar
    field: protein_fraction
