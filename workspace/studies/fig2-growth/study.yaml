- name: emergent-cell-cycle-length
  classification: secondary
  description: Cell-cycle length PREDICTED from the synthesized inventory (emergent-mass doubling) is
    biologically plausible (gap 2b, phenotype from genotype).
  measure:
    kind: derived_scalar
    field: emergent_doubling_time_h
  pass_if:
