schema_version: 4
name: fig7-kinetic-parameters
title: 'Fig 7E-G — Kinetic parameters: growth depends sigmoidally on an enzyme''s kcat (Vmax proxy)'
created: '2026-09-12'
status: complete
phase: Evaluate
question: 'Does the reduced-but-genuine viva-Mgen cell reproduce Fig 7E-G''s central

  quantitative claim — that predicted growth rate depends on an enzyme''s kinetic

  parameter (kcat/Vmax), producing a SIGMOIDAL growth-vs-kcat curve that rises

  from near-zero at low activity and saturates at the wild-type rate once the

  enzyme is no longer rate-limiting?

  '
hypothesis: 'If a genuinely growth-limiting reaction''s FBA flux bound is used as a kcat

  proxy and swept over ~three decades (0.01–10x wild-type), growth_fraction

  should rise monotonically with the bound and then plateau at 1.0, mirroring the

  saturating kcat→growth dependence the paper uses to reconcile model and

  experiment for lpdA/deoD/thyA.

  '
objective: 'Programmatically identify a growth-limiting reaction in the iPS189 network

  (one whose bound binds when throttled yet whose growth recovers to the

  wild-type plateau before the top of the sweep), sweep its flux bound over

  np.logspace(-2, 1, 16) with MetabolismFbaReproductionProcess, and read out

  whether the kcat→growth curve is monotonic, saturating, and has a clear

  dynamic range.

  '
description: 'REDUCED / representative fidelity. kcat is modelled as a multiplicative scale

  on a target reaction''s FBA flux bound (a Vmax proxy) via

  MetabolismFbaReproductionProcess(config={"reaction_bound_scale": {rid: s}}),

  NOT explicit enzyme kinetics; the specific lpdA/deoD/thyA genetics are not

  individually modelled. run.py first scans candidate reactions (central-carbon

  shortlist plus every reaction carrying flux at the optimum) at scales

  {0.05, 0.2, 1.0} and keeps those that are both limiting (growth drops when

  throttled) and saturating (growth back at the wild-type plateau by 0.2x). The

  chosen primary target is the leucine-uptake reaction EX_leu_DASH_L_e — an

  amino-acid transporter Vmax proxy; M. genitalium is auxotrophic for most amino

  acids, so amino-acid provisioning is a real growth-limiting kinetic step, the

  same qualitative role the paper''s biosynthetic enzymes play. Lysine uptake

  (EX_lys_DASH_L_e) and potassium uptake (EX_k_e) are shown as secondary series.

  Achieved (committed production run) for EX_leu_DASH_L_e: monotonic

  (growth_is_monotonic_in_kcat = 1.0), saturating (growth_saturates = 1.0),

  dynamic_range = 0.864 (growth 0.136 at 0.01x rising to 1.000 at >=0.1x).

  '
baseline:
- name: baseline
  composite: viva_mgen.composites.mgen.mycoplasma_genitalium
  params: {}
variants: []
simulation_set:
- name: baseline
  status: ran
  base_model: viva_mgen.composites.mgen.mycoplasma_genitalium
  duration_min: 1
  seeds:
  - 0
  condition: Canonical viva-Mgen fig7-kinetic-parameters run via sims/run.py (recorded in .pbg/runs.jsonl).
  params:
    reaction_id: EX_leu_DASH_L_e
    bound_scale: 1.0
  readouts:
  - growth_is_monotonic_in_kcat
  - growth_saturates
  - dynamic_range
  applies_tests:
  - growth-monotonic-in-kcat
  - growth-saturates-at-high-kcat
  - kcat-has-dynamic-range
expected_behavior:
- name: growth-monotonic-in-kcat
  en: Growth is non-decreasing across the increasing kcat-proxy sweep.
  observable: growth_is_monotonic_in_kcat
  condition: growth_is_monotonic_in_kcat == 1.0
  rationale: 'Fig 7E: relaxing a rate-limiting Vmax cannot decrease FBA growth.'
  measure:
    kind: derived_scalar
    field: growth_is_monotonic_in_kcat
  expect:
    op: range
    low: 1.0
    high: 1.0
- name: growth-saturates-at-wt
  en: Growth recovers the wild-type rate at high kcat (saturates at ~1).
  observable: growth_saturates_at_wt
  condition: growth_saturates_at_wt == 1.0
  rationale: 'Fig 7E: the predicted-growth-vs-kcat curve saturates at the wild-type growth rate.'
  measure:
    kind: derived_scalar
    field: growth_saturates_at_wt
  expect:
    op: range
    low: 1.0
    high: 1.0
- name: growth-sigmoidal-in-kcat
  en: Growth is a sigmoidal (low plateau -> rise -> high plateau) function of kcat.
  observable: growth_is_sigmoidal
  condition: growth_is_sigmoidal == 1.0
  rationale: 'Fig 7E: growth depends sigmoidally on the enzyme kcat.'
  measure:
    kind: derived_scalar
    field: growth_is_sigmoidal
  expect:
    op: range
    low: 1.0
    high: 1.0
- name: growth-dynamic-range
  en: Growth spans near-0 to ~1 across the kcat sweep (wide dynamic range).
  observable: growth_dynamic_range
  condition: 0.7 <= growth_dynamic_range <= 1.0
  rationale: 'Fig 7E: reducing kcat drives growth from the WT rate down toward non-growing.'
  measure:
    kind: derived_scalar
    field: growth_dynamic_range
  expect:
    op: range
    low: 0.7
    high: 1.0
- name: growth-at-max-kcat-near-wt
  en: At high kcat, growth equals the wild-type rate.
  observable: growth_at_max_kcat
  condition: 0.95 <= growth_at_max_kcat <= 1.05
  rationale: 'Fig 7E: high kcat -> WT growth (enzyme no longer limiting).'
  measure:
    kind: derived_scalar
    field: growth_at_max_kcat
  expect:
    op: range
    low: 0.95
    high: 1.05
- name: growth-at-min-kcat-low
  en: At very low kcat, growth is severely reduced.
  observable: growth_at_min_kcat
  condition: 0.0 <= growth_at_min_kcat <= 0.3
  rationale: 'Fig 7E: at low kcat the enzyme is strongly rate-limiting; ~5% throughput reaches WT (nox/lpdA).'
  measure:
    kind: derived_scalar
    field: growth_at_min_kcat
  expect:
    op: range
    low: 0.0
    high: 0.3
- name: kcat-half-max-below-wt
  en: Half-maximal growth is reached well below the WT kcat.
  observable: kcat_half_max
  condition: 0.001 <= kcat_half_max <= 0.5
  rationale: 'Fig 7E: growth is half-maximal at a small fraction of WT kcat, then saturates.'
  measure:
    kind: derived_scalar
    field: kcat_half_max
  expect:
    op: range
    low: 0.001
    high: 0.5
behavior_tests:
- name: growth-monotonic-in-kcat
  classification: primary
  description: Growth is non-decreasing across the increasing kcat-proxy sweep.
  measure:
    kind: derived_scalar
    field: growth_is_monotonic_in_kcat
