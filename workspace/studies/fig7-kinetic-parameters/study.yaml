schema_version: 4
name: fig7-kinetic-parameters
title: "Fig 7E-G — Kinetic parameters: growth depends sigmoidally on an enzyme's kcat (Vmax proxy)"
created: '2026-09-12'
status: complete
phase: Evaluate

question: |
  Does the reduced-but-genuine viva-Mgen cell reproduce Fig 7E-G's central
  quantitative claim — that predicted growth rate depends on an enzyme's kinetic
  parameter (kcat/Vmax), producing a SIGMOIDAL growth-vs-kcat curve that rises
  from near-zero at low activity and saturates at the wild-type rate once the
  enzyme is no longer rate-limiting?
hypothesis: |
  If a genuinely growth-limiting reaction's FBA flux bound is used as a kcat
  proxy and swept over ~three decades (0.01–10x wild-type), growth_fraction
  should rise monotonically with the bound and then plateau at 1.0, mirroring the
  saturating kcat→growth dependence the paper uses to reconcile model and
  experiment for lpdA/deoD/thyA.
objective: |
  Programmatically identify a growth-limiting reaction in the iPS189 network
  (one whose bound binds when throttled yet whose growth recovers to the
  wild-type plateau before the top of the sweep), sweep its flux bound over
  np.logspace(-2, 1, 16) with MetabolismFbaReproductionProcess, and read out
  whether the kcat→growth curve is monotonic, saturating, and has a clear
  dynamic range.
description: |
  REDUCED / representative fidelity. kcat is modelled as a multiplicative scale
  on a target reaction's FBA flux bound (a Vmax proxy) via
  MetabolismFbaReproductionProcess(config={"reaction_bound_scale": {rid: s}}),
  NOT explicit enzyme kinetics; the specific lpdA/deoD/thyA genetics are not
  individually modelled. run.py first scans candidate reactions (central-carbon
  shortlist plus every reaction carrying flux at the optimum) at scales
  {0.05, 0.2, 1.0} and keeps those that are both limiting (growth drops when
  throttled) and saturating (growth back at the wild-type plateau by 0.2x). The
  chosen primary target is the leucine-uptake reaction EX_leu_DASH_L_e — an
  amino-acid transporter Vmax proxy; M. genitalium is auxotrophic for most amino
  acids, so amino-acid provisioning is a real growth-limiting kinetic step, the
  same qualitative role the paper's biosynthetic enzymes play. Lysine uptake
  (EX_lys_DASH_L_e) and potassium uptake (EX_k_e) are shown as secondary series.
  Achieved (committed production run) for EX_leu_DASH_L_e: monotonic
  (growth_is_monotonic_in_kcat = 1.0), saturating (growth_saturates = 1.0),
  dynamic_range = 0.864 (growth 0.136 at 0.01x rising to 1.000 at >=0.1x).

baseline:
- name: baseline
  composite: viva_mgen.composites.mgen.mycoplasma_genitalium
  params: {}

variants: []

simulation_set:
- name: baseline
  status: ran
  base_model: viva_mgen.composites.mgen.mycoplasma_genitalium
  duration_min: 1
  seeds:
  - 0
  condition: >-
    Canonical viva-Mgen fig7-kinetic-parameters run via sims/run.py (recorded in .pbg/runs.jsonl).
  params: {'reaction_id': 'EX_leu_DASH_L_e', 'bound_scale': 1.0}
  readouts:
  - growth_is_monotonic_in_kcat
  - growth_saturates
  - dynamic_range
  applies_tests:
  - growth-monotonic-in-kcat
  - growth-saturates-at-high-kcat
  - kcat-has-dynamic-range

expected_behavior:
- name: growth-monotonic-in-kcat
  en: "Growth rate increases monotonically with the enzyme's kcat proxy (Fig 7E)."
  observable: growth_is_monotonic_in_kcat
  condition: growth_is_monotonic_in_kcat == 1.0
  rationale: >-
    Relaxing a rate-limiting enzyme's Vmax can only help or leave growth
    unchanged, never hurt it — the kcat→growth curve is non-decreasing.
    Achieved 1.0 over the 16-point 0.01–10x sweep of EX_leu_DASH_L_e.
  measure: {kind: derived_scalar, field: growth_is_monotonic_in_kcat}
  expect: {op: range, low: 1.0, high: 1.0}
- name: growth-saturates-at-high-kcat
  en: "Growth saturates at the wild-type rate once the enzyme is no longer rate-limiting (Fig 7E-G plateau)."
  observable: growth_saturates
  condition: growth_saturates == 1.0
  rationale: >-
    Beyond the kcat where the enzyme stops limiting flux, further increases give
    no extra growth — the curve plateaus. Growth at the top of the sweep is
    within 3% of the maximum. Achieved 1.0.
  measure: {kind: derived_scalar, field: growth_saturates}
  expect: {op: range, low: 1.0, high: 1.0}
- name: kcat-has-dynamic-range
  en: "Throttling the enzyme's kcat proxy moves growth appreciably (the reaction is genuinely limiting)."
  observable: dynamic_range
  condition: dynamic_range > 0.3
  rationale: >-
    A meaningful sigmoid requires the reaction to actually constrain growth when
    throttled; max minus min growth over the sweep must be clearly positive.
    Achieved 0.864.
  measure: {kind: derived_scalar, field: dynamic_range}
  expect: {op: range, low: 0.3, high: 1.05}

behavior_tests:
- name: growth-monotonic-in-kcat
  classification: primary
  description: "Growth is non-decreasing across the increasing kcat-proxy sweep (flag == 1.0)."
  measure: {kind: derived_scalar, field: growth_is_monotonic_in_kcat}
  pass_if:
    op: range
    low: 1.0
    high: 1.0
    provenance:
      kind: theory
      note: >-
        Relaxing a rate-limiting Vmax cannot decrease FBA growth; the kcat→growth
        curve is monotonic (Karr 2012 Fig 7E). Achieved 1.0.
  requires_simulation: baseline
- name: growth-saturates-at-high-kcat
  classification: primary
  description: "Growth at the top of the sweep is within 3% of the sweep maximum (flag == 1.0)."
  measure: {kind: derived_scalar, field: growth_saturates}
  pass_if:
    op: range
    low: 1.0
    high: 1.0
    provenance:
      kind: theory
      note: >-
        Past the point where the enzyme stops limiting flux, growth plateaus at
        the wild-type rate (Karr 2012 Fig 7E-G). Achieved 1.0.
  requires_simulation: baseline
- name: kcat-has-dynamic-range
  classification: secondary
  description: "max minus min growth_fraction over the 0.01–10x sweep exceeds 0.3."
  measure: {kind: derived_scalar, field: dynamic_range}
  pass_if:
    op: range
    low: 0.3
    high: 1.05
    provenance:
      kind: model
      note: >-
        EX_leu_DASH_L_e is genuinely growth-limiting; sweeping its bound moves
        growth from 0.136 to 1.000. Achieved dynamic_range 0.864.
  requires_simulation: baseline

