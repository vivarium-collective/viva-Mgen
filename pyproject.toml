[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-mgen"
version = "0.1.0"
description = "Viva-native (process-bigraph) reproduction of the Karr et al. 2012 Mycoplasma genitalium whole-cell model"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema",
    "process-bigraph",
    "numpy",
    "scipy",
    "plotly",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-mGen"
Issues = "https://github.com/vivarium-collective/viva-mGen/issues"

[tool.hatch.build.targets.wheel]
packages = ["viva_mgen"]

[tool.uv.sources]
vivarium-workbench = { path = "/Users/eranagmon/code/vivarium-workbench", editable = true }
